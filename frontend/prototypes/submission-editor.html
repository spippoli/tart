<!doctype html>
<!--
  PROTOTYPE — throwaway. Issue #27: Submission form flow.
  Three structurally different editors for the same Submission, switchable via ?variant=A|B|C:
    A  Stepper: one section per step, numbered progress list, review step at the end.
    B  Single page: all sections stacked as disclosures, sticky checklist, Edit/Preview tabs.
    C  Live label: the editor IS the record's catalogue label; each block opens a side panel form.
  Five Submission kinds via ?kind=new|edit|doc|event|artist, and ?resume=1 simulates reopening a
  half-filled server-side draft. Open by double-clicking. No dependencies, no persistence.
  All records are FICTIONAL. Strings are inline Italian: not production code, no i18n.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Submission editor (#27)</title>
<style>
  :root {
    --paper: #f4f1ea; --paper-2: #ebe6db; --ink: #1d1b18; --ink-2: #5b564d; --rule: #c9c2b4;
    --gone: #8a3b22; --proposed: #3b4a8a; --err: #8a1f1f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); padding-bottom: 100px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--proposed); outline-offset: 2px; }
  .proto-banner { background: var(--ink); color: var(--paper); font: 12px/1.4 var(--mono); padding: 6px 16px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding: 14px 0 8px; flex-wrap: wrap; }
  .archive-head h1 { font: 600 20px/1.1 var(--serif); margin: 0; }
  .archive-head small { font: 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .crumbs { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
  .ed-title { font: 600 28px/1.1 var(--serif); margin: 6px 0 4px; }
  .draftbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-2); padding: 6px 0 12px; border-bottom: 1px solid var(--rule); }
  .draftbar .tag { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; border: 1.5px dashed var(--proposed); color: var(--proposed); padding: 1px 6px; }
  .resume { margin: 12px 0; padding: 10px 12px; border-left: 4px solid var(--proposed); background: #fff8; }
  .btn { border: 1.5px solid var(--ink); background: var(--paper); padding: 7px 14px; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.link { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { margin: 0 0 14px; }
  .field > label, .field > .lbl, fieldset > legend { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .hint { font-size: 13px; color: var(--ink-2); margin: 2px 0 6px; }
  input[type=text], input[type=url], select, textarea { border: 1.5px solid var(--ink-2); background: #fffdf8; padding: 6px 8px; min-width: 0; }
  input[type=text], input[type=url], textarea { width: 100%; }
  textarea { min-height: 70px; }
  fieldset { border: 1px solid var(--rule); padding: 10px 12px; margin: 0 0 14px; }
  .chk { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
  .err-inline { color: var(--err); font-size: 13px; font-weight: 600; margin: 4px 0; }
  .err-inline::before { content: "Errore: "; }
  .has-err input, .has-err select, .has-err textarea { border-color: var(--err); border-width: 2px; }
  .errsum { border: 3px solid var(--err); padding: 10px 14px; margin: 14px 0; background: #fff; }
  .errsum h2 { font-size: 16px; margin: 0 0 6px; color: var(--err); }
  .errsum ul { margin: 0; padding-left: 20px; }
  .readout { font: 15px var(--serif); padding: 4px 8px; background: var(--paper-2); display: inline-block; margin-top: 6px; }
  .note { font-size: 13px; padding: 8px 10px; background: var(--paper-2); border-left: 3px solid var(--ink-2); margin: 8px 0; }
  .warn { padding: 10px 12px; border: 2px solid var(--ink); background: #fff; margin: 10px 0; }
  .warn h3 { margin: 0 0 6px; font-size: 15px; }
  .ico { width: 1em; height: 1em; vertical-align: -0.15em; }
  .proposed-box { border: 2px dashed var(--proposed); background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(59,74,138,.07) 8px 16px); padding: 8px 10px; }
  .proposed-tag { display: inline-flex; gap: 4px; align-items: center; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--proposed); border: 1.5px dashed var(--proposed); padding: 1px 6px; background: var(--paper); }
  .map { position: relative; background: #e6e1d5; border: 1px solid var(--rule); overflow: hidden; cursor: crosshair; }
  .map svg { display: block; width: 100%; height: auto; }
  .map .pin { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 2px; cursor: pointer; }
  .map .pin[aria-pressed="true"] { outline: 3px solid var(--proposed); }
  .map .newpin { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-size: 26px; }
  .map .halo { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(29,27,24,.25) 4px 6px); border: 1px dashed var(--ink); pointer-events: none; }
  .upload { border: 1px solid var(--rule); background: #fffdf8; padding: 10px; margin-bottom: 10px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
  @media (max-width: 600px) { .upload { grid-template-columns: 1fr; } }
  .thumb { width: 96px; height: 72px; background: var(--paper-2); display: grid; place-items: center; font: 10px var(--mono); color: var(--ink-2); text-align: center; border: 1px solid var(--rule); }
  .dropzone { border: 2px dashed var(--ink-2); padding: 16px; text-align: center; background: #fffdf8; }
  .label-preview { font: 17px/1.5 var(--serif); border-top: 2px solid var(--ink); padding-top: 12px; }
  .label-preview h2 { font: 600 30px/1.05 var(--serif); margin: 0 0 6px; }
  .label-preview p { margin: 0 0 4px; }
  .label-preview em { color: var(--ink-2); }
  .A-cond { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; display: inline-flex; gap: 5px; align-items: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cmp { display: grid; grid-template-columns: 140px 1fr 1fr; gap: 0; border-top: 1px solid var(--ink); font-size: 14px; }
  .cmp > div { padding: 8px 6px; border-bottom: 1px solid var(--rule); }
  .cmp .h { font: 11px var(--mono); text-transform: uppercase; color: var(--ink-2); }
  @media (max-width: 600px) { .cmp { grid-template-columns: 1fr; } .cmp .h { display: none; } }

  /* ---------- A: stepper ---------- */
  .A { display: grid; grid-template-columns: 250px 1fr; gap: 28px; margin-top: 16px; }
  @media (max-width: 820px) { .A { grid-template-columns: 1fr; } }
  .A-steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .A-steps li button { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; border-left: 3px solid transparent; background: none; padding: 8px 6px; cursor: pointer; }
  .A-steps li button[aria-current="step"] { border-left-color: var(--ink); background: var(--paper-2); font-weight: 600; }
  .A-steps .n { font: 600 14px var(--mono); border: 1.5px solid var(--ink); width: 24px; height: 24px; display: grid; place-items: center; }
  .A-steps .st { display: block; font: 11px var(--mono); text-transform: uppercase; color: var(--ink-2); font-weight: 400; }
  .A-steps .st.bad { color: var(--err); font-weight: 600; }
  .A-panel h2 { font: 600 22px var(--serif); margin: 0 0 4px; }
  .A-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--rule); flex-wrap: wrap; }

  /* ---------- B: single page ---------- */
  .B { display: grid; grid-template-columns: 1fr 260px; gap: 28px; margin-top: 12px; }
  @media (max-width: 860px) { .B { grid-template-columns: 1fr; } .B-aside { order: -1; } }
  .B-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--ink); margin-bottom: 12px; }
  .B-tabs button { border: 0; background: none; padding: 8px 16px; cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; }
  .B-tabs button[aria-selected="true"] { border-bottom-color: var(--ink); font-weight: 700; }
  .B-sec { border-top: 1px solid var(--ink); }
  .B-sec > h2 { margin: 0; }
  .B-sec > h2 button { width: 100%; display: flex; justify-content: space-between; gap: 10px; text-align: left; border: 0; background: none; padding: 12px 0; cursor: pointer; font: 600 19px var(--serif); }
  .B-sec .sum { font: 13px var(--sans); color: var(--ink-2); font-weight: 400; }
  .B-sec .body { padding: 4px 0 16px; }
  .B-aside .sticky { position: sticky; top: 10px; border: 1px solid var(--ink); padding: 12px; background: #fff8; }
  .B-aside ol { padding-left: 20px; margin: 6px 0 12px; font-size: 14px; }
  .B-aside li { margin: 3px 0; }

  /* ---------- C: live label ---------- */
  .C { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-top: 14px; }
  @media (max-width: 900px) { .C { grid-template-columns: 1fr; } }
  .C-block { position: relative; border: 1px dashed transparent; padding: 8px 10px; margin: 0 -10px 6px; }
  .C-block.empty { border-color: var(--ink-2); color: var(--ink-2); }
  .C-block.active { border: 2px solid var(--ink); background: #fff8; }
  .C-block.bad { border: 2px solid var(--err); }
  .C-block .edit { float: right; margin-left: 8px; }
  .C-block .k { font: 11px var(--mono); text-transform: uppercase; color: var(--ink-2); display: block; }
  .C-panel { border: 2px solid var(--ink); background: #fffdf8; padding: 14px 16px; align-self: start; position: sticky; top: 10px; max-height: calc(100vh - 120px); overflow: auto; }
  .C-panel h2 { font: 600 20px var(--serif); margin: 0 0 8px; }
  .C-bar { position: sticky; bottom: 64px; margin-top: 20px; background: var(--ink); color: var(--paper); padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .C-bar .btn { border-color: var(--paper); }
  .C-start { border: 2px solid var(--ink); padding: 16px; background: #fffdf8; margin-top: 14px; }
  .C-start h2 { font: 600 24px var(--serif); margin: 0 0 6px; }

  /* ---------- notes + switcher (not part of the design) ---------- */
  .notes { position: fixed; right: 12px; top: 40px; bottom: 80px; width: min(460px, calc(100vw - 24px)); overflow: auto; background: #fff; color: #111; border: 2px solid #111; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 16px 18px; font: 14px/1.5 var(--sans); z-index: 20; }
  .notes h2 { font-size: 16px; margin: 0 0 8px; } .notes h3 { font-size: 13px; margin: 14px 0 4px; text-transform: uppercase; }
  .notes ol, .notes ul { padding-left: 20px; margin: 4px 0; }
  .switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; align-items: center; gap: 4px; padding: 6px 8px; font: 13px var(--sans); z-index: 30; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
  .switcher button { background: #2a2a2a; border: 0; color: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: #fff; color: #111; }
  .switcher .cur { padding: 0 8px; font-weight: 600; min-width: 150px; text-align: center; }
  .switcher .sep { width: 1px; height: 20px; background: #555; margin: 0 4px; }
</style>
</head>
<body>
<div class="proto-banner">PROTOTIPO usa e getta · #27 · tutti i dati sono FITTIZI · nessun salvataggio reale · non è codice di produzione</div>
<div id="app"></div>
<aside class="notes" id="notes" hidden></aside>
<nav class="switcher" id="switcher" aria-label="Prototype switcher"></nav>

<script>
// ================================================================ fixtures (FICTIONAL)
const LOCS = [
  { id: 'L-118', x: 34, y: 42, label: 'Serranda, civico 12 (FITTIZIA)', surface: 'Serranda', artworks: [{ t: 'Gatto con ombrello', c: 'present', cond: 'Intatta' }] },
  { id: 'L-121', x: 47, y: 47, label: 'Muro di cinta, lato nord (FITTIZIA)', surface: 'Muro', artworks: [{ t: 'Senza titolo (lettering argento)', c: 'gone', cond: 'Coperta' }, { t: 'Lupa con occhiali', c: 'present', cond: 'Deteriorata' }] },
  { id: 'L-130', x: 70, y: 30, label: 'Facciata cieca, angolo (FITTIZIA)', surface: 'Facciata', artworks: [{ t: 'Ritratto in blu', c: 'unknown', cond: 'Condizione sconosciuta' }] },
  { id: 'L-140', x: 22, y: 75, label: 'Palo semaforico (FITTIZIA)', surface: 'Palo', artworks: [{ t: 'Sticker "occhio"', c: 'present', cond: 'Intatta' }] },
];
const ARTISTS = ['MRLN (FITTIZIO)', 'Collettivo Ferro Vecchio (FITTIZIO)', 'Nebbia (FITTIZIA)', 'K.ARTA (FITTIZIA)'];
const AREAS = ['Pigneto', 'Quadraro', 'Ostiense', 'San Lorenzo', 'Tor Pignattara', 'Municipio V'];
const TYPES = ['Murale', 'Graffiti (lettering)', 'Stencil', 'Paste-up', 'Sticker', 'Installazione', 'Mosaico', 'Altro'];
const SURFACES = ['Muro', 'Facciata', 'Serranda', 'Palo', 'Pavimentazione', 'Cabina', 'Altro'];
const LICENCES = ['CC BY-SA 4.0', 'CC BY 4.0', 'CC0 1.0'];
const EVENTS = {
  'Ancora visibile': { deteriorated: 'Deterioramento', damaged: 'Danneggiamento', modified: 'Modifica (es. ritocco, aggiunte)' },
  'Non più visibile': { covered: 'Coperta', removed: 'Rimossa', destroyed: 'Distrutta', missing: 'Non più ritrovata (causa ignota)' },
  'Altri eventi': { created: 'Realizzazione', relocated: 'Spostamento su altra superficie', claimed: 'Rivendicazione pubblica dell\'artista' },
};
const TARGET = { title: 'Lupa con occhiali', id: 'A-2207', rev: 'rev. 4 · 3 mar 2026', types: ['Murale'], desc: 'Lupa capitolina con occhiali da sole, a spray, circa 3 × 2 m.', attr: 'MRLN (FITTIZIO) — probabile', created: 'c. 2019', cond: 'Deteriorata', loc: 'Muro di cinta, lato nord (FITTIZIA)' };

const freshDate = () => ({ q: 'exact', prec: 'day', v: '' });
const freshDoc = (name, exif) => ({ name, observed: exif ? { q: 'exact', prec: 'day', v: '2026-04-12', exif: true } : freshDate(), licence: 'CC BY-SA 4.0', credit: '', basis: 'own', origin: '', link: name === null });

function freshDraft(resume) {
  const d = {
    new: { loc: { mode: null, existing: null, pt: null, approx: false, radius: '', surface: '', dupAck: false }, docs: [], details: { untitled: false, title: '', types: [], desc: '' }, attr: { mode: null, items: [] }, created: { known: false, date: freshDate() }, sources: [], note: '' },
    edit: { changes: {}, attrItems: [], sources: [], note: '' },
    doc: { docs: [], cond: false, event: { type: '', date: freshDate() }, sources: [], note: '' },
    event: { type: '', date: freshDate(), covering: '', docs: [], sources: [], note: '' },
    artist: { name: '', kind: 'individual', aliases: [''], from: freshDate(), to: freshDate(), areas: [], crews: [], bio: '', sources: [], note: '' },
    terms: true,
  };
  if (resume) {
    d.new.loc = { mode: 'new', existing: null, pt: { x: 49, y: 51 }, approx: false, radius: '', surface: 'Muro', dupAck: true };
    d.new.docs = [freshDoc('IMG_4471.heic', true)];
    d.edit.changes = { desc: 'Lupa capitolina con occhiali da sole, a spray, circa 3 × 2 m; firmata in basso a destra.' };
    d.event.type = 'covered';
    d.artist.name = 'Nebbia (FITTIZIA)';
  }
  return d;
}

// ================================================================ state
const P = new URLSearchParams(location.search);
const S = {
  variant: P.get('variant') || 'A', kind: P.get('kind') || 'new', resume: P.get('resume') === '1',
  step: 0, open: {}, tab: 'edit', active: null, errors: [], tried: false, sent: false, showNotes: false,
};
let D = freshDraft(S.resume);
const savedAt = () => new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
let lastSave = S.resume ? '3 giorni fa, 21:14' : null;

// ================================================================ helpers
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = path => path.split('.').reduce((o, k) => o?.[k], D);
const set = (path, v) => { const ks = path.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], D)[last] = v; lastSave = savedAt(); };
const sym = g => {
  const dash = g === 'gone' ? 'stroke-dasharray="3 2"' : g === 'unknown' ? 'stroke-dasharray="1 2"' : '';
  const fill = g === 'present' ? 'var(--ink)' : 'none';
  const col = g === 'gone' ? 'var(--gone)' : 'var(--ink)';
  return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="${fill}" stroke="${col}" stroke-width="2" ${dash}/>${g === 'unknown' ? '<text x="8" y="12" font-size="10" text-anchor="middle" fill="var(--ink)">?</text>' : ''}</svg>`;
};
const QUAL = { exact: 'esatta', circa: 'circa', before: 'prima del', after: 'dopo il', unknown: 'sconosciuta' };
const PREC = { day: 'giorno', month: 'mese', year: 'anno', decade: 'decennio' };
function dateText(d) {
  if (!d || d.q === 'unknown') return 'data sconosciuta';
  if (!d.v) return '—';
  let v = d.v;
  if (d.prec === 'day') { const [y, m, dd] = v.split('-'); v = new Date(+y, +m - 1, +dd).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }); }
  if (d.prec === 'month') { const [y, m] = v.split('-'); v = new Date(+y, +m - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }); }
  if (d.prec === 'decade') v = `anni ${String(v).slice(0, 3)}0`;
  return { exact: '', circa: 'c. ', before: 'prima del ', after: 'dopo il ' }[d.q] + v;
}
function dateRange(d) {
  if (!d || d.q === 'unknown' || !d.v) return '';
  const y = parseInt(d.v, 10); if (!y) return '';
  if (d.prec === 'decade') { const s = Math.floor(y / 10) * 10; return `intervallo salvato: 1 gen ${s} – 31 dic ${s + 9}`; }
  if (d.q === 'circa' && d.prec === 'year') return `intervallo salvato: 1 gen ${y - 2} – 31 dic ${y + 2}`;
  if (d.q === 'before') return `intervallo salvato: aperto – ${d.v}`;
  if (d.q === 'after') return `intervallo salvato: ${d.v} – aperto`;
  return '';
}

// ================================================================ components
const err = id => S.tried ? S.errors.find(e => e.id === id) : null;
const errMsg = id => { const e = err(id); return e ? `<p class="err-inline" id="${id}-err">${esc(e.msg)}</p>` : ''; };
const desc = (id, hint) => [hint ? `${id}-hint` : '', err(id) ? `${id}-err` : ''].filter(Boolean).join(' ');

function text(path, label, hint, opts = {}) {
  const id = path.replace(/\./g, '-');
  const tag = opts.area ? `<textarea id="${id}" data-bind="${path}" aria-describedby="${desc(id, hint)}">${esc(get(path))}</textarea>`
    : `<input type="${opts.type || 'text'}" id="${id}" data-bind="${path}" value="${esc(get(path))}" aria-describedby="${desc(id, hint)}" ${err(id) ? 'aria-invalid="true"' : ''}>`;
  return `<div class="field ${err(id) ? 'has-err' : ''}"><label for="${id}">${label}</label>${hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ''}${errMsg(id)}${tag}</div>`;
}
function select(path, label, options, hint) {
  const id = path.replace(/\./g, '-'); const cur = get(path);
  const opts = Array.isArray(options) ? options.map(o => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')
    : Object.entries(options).map(([g, os]) => typeof os === 'string' ? `<option value="${g}" ${g === cur ? 'selected' : ''}>${esc(os)}</option>`
      : `<optgroup label="${esc(g)}">${Object.entries(os).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(v)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="field ${err(id) ? 'has-err' : ''}"><label for="${id}">${label}</label>${hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ''}${errMsg(id)}<select id="${id}" data-bind="${path}" data-rerender aria-describedby="${desc(id, hint)}">${opts}</select></div>`;
}
function uncertainDate(path, legend, hint) {
  const d = get(path); const id = path.replace(/\./g, '-');
  const inputType = d.prec === 'day' ? 'date' : d.prec === 'month' ? 'month' : 'number';
  return `<fieldset class="${err(id) ? 'has-err' : ''}"><legend>${legend}</legend>${hint ? `<p class="hint">${hint}</p>` : ''}${errMsg(id)}
    ${d.exif ? `<p class="note">Precompilata dai dati dello scatto (EXIF). Controlla che sia il giorno in cui l'opera è stata osservata.</p>` : ''}
    <div class="row">
      <div><label class="hint" for="${id}-q">Qualificatore</label><br><select id="${id}-q" data-bind="${path}.q" data-rerender>${Object.entries(QUAL).map(([k, v]) => `<option value="${k}" ${k === d.q ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      ${d.q === 'unknown' ? '' : `
      <div><label class="hint" for="${id}-p">Precisione</label><br><select id="${id}-p" data-bind="${path}.prec" data-rerender>${Object.entries(PREC).map(([k, v]) => `<option value="${k}" ${k === d.prec ? 'selected' : ''}>${v}</option>`).join('')}</select></div>

function validate() {
  const e = []; const k = S.kind;
  const docErrs = path => get(path).forEach((d, i) => {
    const id = `${path}.${i}`.replace(/\./g, '-');
    if (d.observed.q !== 'unknown' && !d.observed.v) e.push({ id: `${id}-observed`, sec: path.split('.')[1] === 'docs' && k === 'event' ? 'evidence' : 'docs', msg: `Documento ${i + 1}: indica la data di osservazione, oppure scegli "sconosciuta".` });
    if (!d.link && !d.credit) e.push({ id: `${id}-credit`, sec: k === 'event' ? 'evidence' : 'docs', msg: `Documento ${i + 1}: indica il credito dell'autore del file.` });
    if ((d.link || d.basis === 'third') && !d.origin) e.push({ id: `${id}-origin`, sec: k === 'event' ? 'evidence' : 'docs', msg: `Documento ${i + 1}: indica l'URL di origine.` });
  });
  const attrErrs = (path, sec) => (get(path) || []).forEach((it, i) => {
    if (it.cert === 'confirmed' && !(it.cites || []).length) e.push({ id: `${path}-${i}-cert`.replace(/\./g, '-'), sec, msg: `Attribuzione ${i + 1}: "confermata" richiede almeno una prova citata.` });
  });
  if (k === 'new') {
    const n = D.new;
    if (!n.loc.mode) e.push({ id: 'new-loc', sec: 'loc', msg: 'Scegli una superficie esistente o segna un nuovo punto sulla mappa.' });
    if ((n.loc.mode === 'existing' || nearby().length) && !n.loc.dupAck) e.push({ id: 'dup', sec: 'loc', msg: 'Conferma che non è una delle opere già documentate qui.' });
    if (n.loc.mode === 'new' && !n.loc.surface) e.push({ id: 'new-loc-surface', sec: 'loc', msg: 'Indica il tipo di superficie.' });
    if (!n.docs.length) e.push({ id: 'new-docs', sec: 'docs', msg: 'Aggiungi almeno un documento (foto, PDF o link).' });
    docErrs('new.docs');
    if (!n.details.untitled && !n.details.title) e.push({ id: 'new-details-title', sec: 'details', msg: 'Indica il titolo, oppure seleziona "Senza titolo".' });
    if (!n.details.types.length) e.push({ id: 'new-details-types', sec: 'details', msg: 'Scegli almeno un tipo di espressione.' });
    if (!n.attr.mode) e.push({ id: 'new-attr', sec: 'attr', msg: 'Indica l\'autore o scegli "Non si sa".' });
    attrErrs('new.attr.items', 'attr');
