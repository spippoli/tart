  PROTOTYPE — throwaway. Issue #17: status, uncertainty and condition presentation.
  Three structurally different variants of the same surfaces (map markers, cards,
  detail page, timeline), switchable via ?variant=A|B|C and the floating bottom bar.
  Open by double-clicking. No dependencies, no persistence. All records are FICTIONAL.
  Not production code: strings live in one small dictionary only so IT/EN length can be compared.

<style>

    --paper: #f4f1ea; --paper-2: #ebe6db; --ink: #1d1b18; --ink-2: #5b564d; --rule: #c9c2b4;
    --gone: #8a3b22; --proposed: #3b4a8a; --halo: rgba(29,27,24,.10);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding-bottom: 90px; }
  #app.gray { filter: grayscale(1); }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--proposed); outline-offset: 2px; }
  .proto-banner { background: var(--ink); color: var(--paper); font: 12px/1.4 var(--mono); padding: 6px 16px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding: 14px 0 8px; flex-wrap: wrap; }
  .archive-head h1 { font: 600 22px/1.1 var(--serif); margin: 0; letter-spacing: .01em; }

  .ico { width: 1em; height: 1em; vertical-align: -0.15em; flex: none; }
  .fict { font: 10px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .ph { display: block; width: 100%; height: auto; background: var(--paper-2); }
  .gone-ink { color: var(--gone); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .map { position: relative; background: #e6e1d5; border: 1px solid var(--rule); overflow: hidden; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); padding: 8px 0; }

  .proposed-box { border: 2px dashed var(--proposed); background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(59,74,138,.07) 8px 16px); }
  .proposed-tag { display: inline-flex; gap: 4px; align-items: center; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--proposed); border: 1.5px dashed var(--proposed); padding: 1px 6px; background: var(--paper); }

  /* ---------- Variant A: editorial catalogue labels ---------- */
  .A-top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  @media (max-width: 860px) { .A-top { grid-template-columns: 1fr; } }
  .A-labels { display: flex; flex-direction: column; gap: 0; max-height: 560px; overflow: auto; border-top: 1px solid var(--ink); }
  .A-label { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .A-label[aria-current="true"] { background: var(--paper-2); }
  .A-label h3 { font: 600 17px/1.2 var(--serif); margin: 0 0 2px; }
  .A-label .meta { font-size: 13px; color: var(--ink-2); }
  .A-cond { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; display: inline-flex; gap: 5px; align-items: center; }
  .A-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; border-top: 2px solid var(--ink); padding-top: 20px; }
  @media (max-width: 860px) { .A-detail { grid-template-columns: 1fr; } }

  .A-tombstone { font: 17px/1.5 var(--serif); }
  .A-tombstone p { margin: 0 0 4px; }

  .A-condline { margin: 14px 0; padding: 10px 12px; border-left: 4px solid currentColor; background: var(--paper-2); }

  .A-tl { list-style: none; margin: 0; padding: 0; }

  .A-tl .when { font: 14px var(--serif); text-align: right; }
  .A-tl .when small { display: block; font: 11px var(--mono); color: var(--ink-2); }
  .A-tl .what { font-size: 14px; }
  .A-tl .what strong { font: 600 15px var(--serif); }
  .A-tl li.proposed-box { padding: 10px 8px; }
  .A-cites { font-size: 12px; color: var(--ink-2); }

  /* ---------- Variant B: photography first ---------- */
  .B-top { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 860px) { .B-top { grid-template-columns: 1fr; } }
  .B-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .B-card { border: 0; padding: 0; background: none; text-align: left; cursor: pointer; display: flex; flex-direction: column; }
  .B-card[aria-current="true"] .B-photo { outline: 3px solid var(--ink); outline-offset: 3px; }
  .B-photo { position: relative; }
  .B-photo.is-gone img { filter: grayscale(1) contrast(.9); opacity: .85; }
  .B-ribbon { position: absolute; left: 0; right: 0; top: 0; background: var(--gone); color: #fff; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; display: flex; gap: 6px; align-items: center; }
  .B-ribbon.unk { background: var(--ink-2); }
  .B-cap { background: var(--ink); color: var(--paper); padding: 6px 8px; font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
  .B-title { font: 600 15px/1.2 var(--serif); margin: 6px 0 2px; }
  .B-chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .B-frame { flex: none; width: 170px; padding: 0 8px; border-right: 1px dotted var(--rule); font-size: 12.5px; }

  .B-tray { margin-top: 16px; padding: 10px 12px; }

  @media (max-width: 860px) { .C-top { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); border-bottom: 2px solid var(--ink); padding: 6px; vertical-align: bottom; }
  td { border-bottom: 1px solid var(--rule); padding: 7px 6px; vertical-align: top; }
  tr.sel td { background: var(--paper-2); }
  .C-row button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: 600 14px var(--serif); text-decoration: underline; text-underline-offset: 3px; }
  .C-code { font: 600 11px var(--mono); border: 1.5px solid currentColor; padding: 0 4px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  .C-code.gone { color: var(--gone); }
  .C-code.unk { border-style: dotted; }
  .C-cert { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .C-sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 860px) { .C-sheet { grid-template-columns: 1fr; } }
  .C-sheet h2 { font: 600 26px/1.1 var(--serif); margin: 0 0 8px; }
  .C-axis { position: relative; height: 22px; border-bottom: 1px solid var(--ink); font: 10px var(--mono); color: var(--ink-2); }
  .C-axis span { position: absolute; bottom: 2px; transform: translateX(-50%); }
  .C-lane { position: relative; height: 20px; }
  .C-lane .mk { position: absolute; top: 5px; height: 10px; }
  .C-lane .mk.pt { width: 10px; margin-left: -5px; background: var(--ink); border-radius: 50%; }
  .C-lane .mk.rg { background: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 7px); border: 1px solid var(--ink); }
  .C-lane .mk.open-l::before, .C-lane .mk.open-r::after { content: ""; position: absolute; top: -3px; border: 8px solid transparent; }
  .C-lane .mk.open-l::before { left: -14px; border-right-color: var(--ink); }
  .C-lane .mk.open-r::after { right: -14px; border-left-color: var(--ink); }
  .C-lane .mk.prop { background: none; border: 2px dashed var(--proposed); }
  .C-tl td:first-child { width: 42%; }

  /* ---------- notes panel + switcher (not part of the design) ---------- */
  .notes { position: fixed; right: 12px; top: 40px; bottom: 80px; width: min(440px, calc(100vw - 24px)); overflow: auto; background: #fff; color: #111; border: 2px solid #111; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 16px 18px; font: 14px/1.5 var(--sans); z-index: 20; filter: none; }
  .notes h2 { font-size: 16px; margin: 0 0 8px; }
  .notes h3 { font-size: 13px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .notes ol, .notes ul { padding-left: 20px; margin: 4px 0; }
  .switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; align-items: center; gap: 4px; padding: 6px 8px; font: 13px var(--sans); z-index: 30; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
  .switcher button { background: #2a2a2a; border: 0; color: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: #fff; color: #111; }
  .switcher .cur { padding: 0 10px; font-weight: 600; min-width: 170px; text-align: center; }
  .switcher .sep { width: 1px; height: 20px; background: #555; margin: 0 4px; }
</style>

    <div class="B-chips" style="gap:6px;font-size:13px">
      <span class="chip">${condIcon(c)} ${L.cond[c]} · ${ld ? `${L.lastDoc} ${fmtDate(ld.date)}` : L.dateUnknown}</span>
      <span class="chip ${certOf(a) === 'confirmed' ? '' : 'dash'}">${certOf(a) === 'disputed' ? ICO.split : ICO.person} ${attributionText(a, 'B')}${certOf(a) !== 'confirmed' && a.attr.length ? ` (${L.cert[certOf(a)]})` : ''}</span>
      <span class="chip ${!cr || isFuzzy(cr.date) ? 'dash' : ''}">${cr ? fmtDate(cr.date) : L.createdUnknown}</span>
      <span class="chip ${a.loc.kind === 'approximate' ? 'dash' : ''}">${a.loc.kind === 'approximate' ? ICO.approx : ICO.exact} ${a.area} · ${L.loc[a.loc.kind]}${a.loc.radius ? `, ${L.radius(a.loc.radius)}` : ''}</span>
      <span class="chip">${a.expr.map(e => EXPR[e]).join(', ')}</span>
    </div>
    <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 2px">${S.lang === 'it' ? 'Riquadro pieno = dato accertato · riquadro tratteggiato = stimato, probabile, conteso o approssimato' : 'Solid box = established · dashed box = estimated, probable, disputed or approximate'}</p>
    <div class="B-strip">${!cr ? `<div class="B-frame ev"><span class="d">?</span><strong>${L.createdUnknown}</strong></div>` : ''}${strip}</div>
    ${S.viewer === 'submitter' && props.length ? `<section class="B-tray proposed-box"><strong>${L.reviewTray}</strong> · <span style="font-size:12.5px">${L.onlyYou}. ${L.proposalNote}</span>
      ${props.map(e => `<p style="margin:6px 0 0">${proposalTag()} <strong>${L.evt[e.type]}</strong> → ${L.cond[e.cond]} · ${L.observed} ${fmtDate(e.date)} · ${L.submitted} ${fmtIso(e.proposal.submitted)}<br><span style="font-size:12.5px">${e.note} · ${evidenceText(e)}</span></p>`).join('')}</section>` : ''}
  </article>`;
}

// ================================================================ Variant C
// Ledger / fact sheet: the catalogue is a table, every fact has an explicit certainty and
// evidence column, map markers are numbered text codes, the timeline is drawn to scale.
function markerC(a) {
  const c = condKey(a), g = group(c);
  return `${halo(a)}<button class="pin" style="${pct(a.x, a.y)}" data-sel="${a.id}" aria-label="${pinLabel(a)}">
    <span class="C-code ${g === 'gone' ? 'gone' : g === 'unknown' ? 'unk' : ''}" style="background:var(--paper)">${a.n} ${t().condShort[c]}${a.loc.kind === 'approximate' ? ' ≈' : ''}</span></button>`;
}
function VariantC() {
  const L = t(), a = ARTWORKS.find(x => x.id === S.sel) || ARTWORKS[0];
  const cr = createdEvent(a), cev = condition(a), ld = lastDoc(a), c = condKey(a);
  const code = x => { const cx = condKey(x), gx = group(cx); return `<span class="C-code ${gx === 'gone' ? 'gone' : gx === 'unknown' ? 'unk' : ''}">${condIcon(cx)} ${L.cond[cx]}</span>`; };
  const rows = ARTWORKS.map(x => {
    const lx = lastDoc(x), cert = certOf(x);
    return `<tr class="C-row ${x.id === a.id ? 'sel' : ''}"><td>${x.n}</td><td><button data-sel="${x.id}">${x.title}</button></td><td>${EXPR[x.expr[0]]}</td><td>${code(x)}</td>
      <td>${lx ? fmtDate(lx.date) : '—'}</td><td>${x.attr.length ? attributionText(x, 'C') : '—'}</td><td class="C-cert">${L.cert[cert]}</td>
      <td>${x.loc.kind === 'approximate' ? `${ICO.approx} ≈ ${x.loc.radius} m` : `${ICO.exact} ${L.known}`}</td></tr>`;
  }).join('') + (S.viewer === 'submitter' ? `<tr class="proposed-box"><td>—</td><td>${PROPOSED_NEW.title}<br>${proposalTag()}</td><td>${EXPR.mural}</td><td colspan="4">${L.submitted} ${fmtIso(PROPOSED_NEW.proposal.submitted)} · ${L.onlyYou}</td><td>${ICO.approx} ≈ ${PROPOSED_NEW.loc.radius} m</td></tr>` : '');

  const certCell = (kind) => ({ known: L.known, est: L.estimated, unk: L.unknownV, disp: L.disputedV })[kind];
  const facts = [
    [L.kExpr, a.expr.map(e => EXPR[e]).join(', '), 'known', '—'],
    [L.kLoc, `${a.area}${a.loc.radius ? `, ${L.radius(a.loc.radius)}` : ''}`, a.loc.kind === 'approximate' ? 'est' : 'known', '—'],
    [L.kAuthor, a.attr.length ? a.attr.map(x => `${x.name} <span class="C-cert">(${L.cert[x.cert]})</span>`).join('<br>') : L.unknownAuthor,
      !a.attr.length ? 'unk' : certOf(a) === 'disputed' ? 'disp' : certOf(a) === 'probable' ? 'est' : 'known',
      a.attr.length ? a.attr.map(x => x.cites ? `${L.ev.documented} · ${L.sources(x.cites)}` : L.ev.reported).join('<br>') : '—'],
    [L.kCreated, cr ? fmtDate(cr.date) : L.dateUnknown, !cr ? 'unk' : isFuzzy(cr.date) ? 'est' : 'known', cr ? L.ev[cr.ev] + (cr.cites ? ` · ${L.sources(cr.cites)}` : '') : '—'],
    [L.kCond, `${code(a)}<br><span style="font-size:12px">${cev ? `${L.since} ${fmtDate(cev.date)}` : ''}${ld ? ` · ${L.lastDoc} ${fmtDate(ld.date)}` : ''}</span>`, cev ? (isFuzzy(cev.date) ? 'est' : 'known') : 'unk', cev ? L.ev[cev.ev] + (cev.cites ? ` · ${L.sources(cev.cites)}` : '') : '—'],
  ];

  // to-scale timeline 2008–2027
  const Y0 = 2008, Y1 = 2027, pos = s => ((Number(s.slice(0, 4)) + (s.length > 4 ? (Number(s.slice(5, 7)) - 1) / 12 : 0)) - Y0) / (Y1 - Y0) * 100;
  const lane = (e) => {
    const dd = e.date;
    let l = pos(dd.from), r = dd.precision === 'decade' ? pos(String(Number(dd.from) + 9)) + 100 / (Y1 - Y0) : pos(dd.to) + (dd.precision === 'year' ? 100 / (Y1 - Y0) : 0);
    let cls = 'mk ' + (isFuzzy(dd) ? 'rg' : 'pt');
    if (dd.qualifier === 'before') { cls += ' open-l'; l = Math.max(0, l - 8); }
    if (dd.qualifier === 'after') { cls += ' open-r'; r = Math.min(100, r + 8); }
    if (dd.qualifier === 'circa') { l -= 2; r += 2; }
    if (e.proposal) cls += ' prop';
    return isFuzzy(dd) || e.proposal ? `<div class="C-lane"><span class="${cls}" style="left:${l}%;width:${Math.max(r - l, 1.5)}%"></span></div>` : `<div class="C-lane"><span class="${cls}" style="left:${l}%"></span></div>`;
  };
  const axis = `<div class="C-axis">${[2010, 2014, 2018, 2022, 2026].map(y => `<span style="left:${pos(String(y))}%">${y}</span>`).join('')}</div>`;
  const tlRows = a.events.filter(e => S.viewer === 'submitter' || !e.proposal).map(e => `<tr class="${e.proposal ? 'proposed-box' : ''}">
      <td>${e.proposal ? proposalTag() + '<br>' : ''}<strong>${e.type === 'doc' ? `${ICO.doc} ${L.evt.doc}` : L.evt[e.type]}</strong>${e.cond ? ` → ${L.cond[e.cond]}` : ''}<br>
      <span style="font-size:12px">${fmtDate(e.date)}${e.type === 'doc' ? ` · ${e.creator}` : ` · ${L.ev[e.ev]}`}${e.proposal ? ` · ${L.submitted} ${fmtIso(e.proposal.submitted)}` : e.approved ? ` · ${L.approved} ${fmtIso(e.approved)}` : ''}</span></td>
      <td>${lane(e)}</td></tr>`).join('');

  return `
  <div class="surface-label">${L.map} + ${L.cards}</div>
  <div class="C-top">
    <div><div class="map">${baseMap()}${ARTWORKS.map(markerC).join('')}${S.viewer === 'submitter' ? `${halo(PROPOSED_NEW)}<span class="pin" style="${pct(PROPOSED_NEW.x, PROPOSED_NEW.y)}"><span class="C-code" style="color:var(--proposed);border-style:dashed;background:var(--paper)">P ≈</span></span>` : ''}</div>
      <div class="legend"><span>${S.lang === 'it' ? 'Codice = N° + condizione' : 'Code = No. + condition'}</span><span>≈ ${L.loc.approximate}</span><span><span class="C-code unk">???</span> ${L.group.unknown}</span></div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>${L.col.n}</th><th>${L.col.title}</th><th>${L.col.type}</th><th>${L.col.cond}</th><th>${L.col.last}</th><th>${L.col.author}</th><th>${L.col.cert}</th><th>${L.col.loc}</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="surface-label">${L.detail} + ${L.timeline}</div>
  <article class="C-sheet">
    <div>
      <h2>${a.n}. ${a.title}</h2>
      <p class="fict">${L.fictional}</p>
      <table><thead><tr><th>${L.col.fact}</th><th>${L.col.value}</th><th>${L.col.certainty}</th><th>${L.col.evidence}</th></tr></thead>
      <tbody>${facts.map(f => `<tr><th scope="row" style="border-bottom:1px solid var(--rule);font-size:11px;vertical-align:top">${f[0]}</th><td>${f[1]}</td><td class="C-cert">${certCell(f[2])}</td><td style="font-size:12px">${f[3]}</td></tr>`).join('')}</tbody></table>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">${docs(a).slice(-2).map(e => `<figure style="margin:0">${photo(a, 300, 200)}<figcaption style="font-size:12px">${fmtDate(e.date)} · ${e.creator}</figcaption></figure>`).join('')}</div>
    </div>
    <div>
      <table class="C-tl"><thead><tr><th>${L.timeline}</th><th>${axis}</th></tr></thead><tbody>${!cr ? `<tr><td><em>${L.createdUnknown}</em></td><td></td></tr>` : ''}${tlRows}</tbody></table>
      <p style="font-size:12px;color:var(--ink-2)">${S.lang === 'it' ? '● punto = data esatta · barra tratteggiata = intervallo/stima · freccia = prima/dopo · contorno blu tratteggiato = proposta' : '● dot = exact date · hatched bar = range/estimate · arrow = before/after · dashed blue outline = proposal'}</p>
    </div>
  </article>`;
}

// ---------------------------------------------------------------- notes (principles to react to)
const NOTES = `
<h2>Principi visivi — bozza da discutere (#17)</h2>
<ol>
  <li><b>Editoriale e archivistico.</b> Carta, inchiostro, serif per titoli e didascalie; una sola tinta per “non più visibile” e una per “proposta”. La fotografia è il materiale primario.</li>
  <li><b>Mai solo colore.</b> Ogni stato = parola + forma (icona, tratteggio, codice). Prova: tasto <i>Grigi</i> in basso.</li>
  <li><b>Incertezza come linguaggio, non come allarme.</b> “c. 2016”, “prima del 2012”, “probabile”, “contesa”, “approssimata”. Niente icone di warning, niente rosso per l’incerto. Convenzione proposta: <i>contorno pieno = accertato, tratteggiato = stimato/incerto</i>.</li>
  <li><b>Scomparsa con dignità.</b> Un’opera distrutta o coperta resta una scheda completa: si mostra l’ultima documentazione con la sua data, non un vuoto.</li>
  <li><b>La Condizione ha sempre una data.</b> Mai “attuale” nudo: “Intatta · ultima documentazione apr 2026”.</li>
  <li><b>Proposto ≠ accertato.</b> Le proposte non sono pubbliche. Per Submitter/Moderatori: tratteggio blu + etichetta “Proposta · in revisione”; non cambiano la Condizione mostrata.</li>
  <li><b>Evidence level è derivato e ispezionabile.</b> “documentato · 2 fonti” rimanda alle citazioni; “segnalato” è neutro, non una colpa.</li>
  <li><b>Tre date distinte</b> (osservato, inviato, approvato) visibili nella timeline, non nelle schede.</li>
</ol>
<h3>Da evitare</h3>
<ul><li>Semaforo verde/giallo/rosso, badge SaaS colorati, gradienti.</li><li>Contatori, like, “popolari”, gamification.</li><li>Placeholder che presuppongono murales colorati.</li><li>Nascondere le opere scomparse dalla mappa di default.</li></ul>
<h3>Domande aperte</h3>
<ul>
  <li>Sulla mappa, le opere scomparse sono visibili di default o dietro un filtro?</li>
  <li>“Coperta” e “distrutta” devono distinguersi già sul marker, o basta “non più visibile”?</li>
  <li>Il pubblico deve sapere che esistono proposte in revisione su un’opera (senza vederne il contenuto)?</li>
  <li>Glossario: il brief dice “present”; il vocabolario Condition dice “intact”. Confermare.</li>
</ul>
<h3>Varianti</h3>
<p><b>A</b> etichetta museale, incertezza tipografica, proposte inline tratteggiate. <b>B</b> foto prima di tutto, scomparse in B/N con nastro, proposte in un vassoio separato. <b>C</b> registro: ogni dato ha colonna Certezza ed Evidenza, timeline in scala.</p>`;

// ---------------------------------------------------------------- render + switcher
function sync() {
  const p = new URLSearchParams();
  p.set('variant', S.variant); if (S.lang !== 'it') p.set('lang', S.lang); if (S.viewer !== 'public') p.set('viewer', S.viewer);
  if (S.gray) p.set('gray', '1'); if (S.notes) p.set('notes', '1'); p.set('art', S.sel);
  history.replaceState(null, '', '?' + p);
}
function render() {
  document.documentElement.lang = S.lang;
  document.getElementById("app").classList.toggle("gray", S.gray);
  const L = t(), V = { A: VariantA, B: VariantB, C: VariantC }[S.variant];
  document.getElementById('app').innerHTML = `<div class="wrap">
    <header class="archive-head"><h1>${L.archive}</h1><small>${L.powered}</small></header>
    <main>${V()}</main></div>`;
  const notes = document.getElementById('notes');
  notes.hidden = !S.notes; notes.innerHTML = NOTES;
  const idx = VARIANTS.findIndex(v => v[0] === S.variant);
  document.getElementById('switcher').innerHTML = `
    <button data-act="prev" aria-label="Variante precedente">←</button>
    <span class="cur">${S.variant} (${VARIANTS[idx][1]})</span>
    <button data-act="next" aria-label="Variante successiva">→</button>
    <span class="sep"></span>
    <button data-act="gray" aria-pressed="${S.gray}">Grigi</button>
    <button data-act="lang" aria-pressed="false">${S.lang.toUpperCase()}</button>
    <button data-act="viewer" aria-pressed="${S.viewer === 'submitter'}">${S.viewer === 'submitter' ? 'Vista Submitter' : 'Vista pubblica'}</button>
    <button data-act="notes" aria-pressed="${S.notes}">Principi</button>`;
  sync();
}
function cycle(dir) {
  const i = VARIANTS.findIndex(v => v[0] === S.variant);
  S.variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0]; render();
}
document.addEventListener('click', e => {
  const sel = e.target.closest('[data-sel]');
  if (sel) { S.sel = sel.dataset.sel; render(); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'prev') cycle(-1);
  if (act === 'next') cycle(1);
  if (act === 'gray') { S.gray = !S.gray; render(); }
  if (act === 'lang') { S.lang = S.lang === 'it' ? 'en' : 'it'; render(); }
  if (act === 'viewer') { S.viewer = S.viewer === 'public' ? 'submitter' : 'public'; render(); }
  if (act === 'notes') { S.notes = !S.notes; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
</body>
</html>
