<!doctype html>
<!--
  PROTOTYPE — throwaway. Issue #17: status, uncertainty and condition presentation.
  Three structurally different variants of the same surfaces (map markers, cards,
  detail page, timeline), switchable via ?variant=A|B|C and the floating bottom bar.
  Open by double-clicking. No dependencies, no persistence. All records are FICTIONAL.
  Not production code: strings live in one small dictionary only so IT/EN length can be compared.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Status presentation (#17)</title>
<style>
  :root {
    --paper: #f4f1ea; --paper-2: #ebe6db; --ink: #1d1b18; --ink-2: #5b564d; --rule: #c9c2b4;
    --gone: #8a3b22; --proposed: #3b4a8a; --halo: rgba(29,27,24,.10);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding-bottom: 90px; }
  #app.gray { filter: grayscale(1); }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--proposed); outline-offset: 2px; }
  .proto-banner { background: var(--ink); color: var(--paper); font: 12px/1.4 var(--mono); padding: 6px 16px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding: 14px 0 8px; flex-wrap: wrap; }
  .archive-head h1 { font: 600 22px/1.1 var(--serif); margin: 0; letter-spacing: .01em; }
  .archive-head small { font: 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .surface-label { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin: 28px 0 8px; display: flex; gap: 8px; align-items: center; }
  .surface-label::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
  .ico { width: 1em; height: 1em; vertical-align: -0.15em; flex: none; }
  .fict { font: 10px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .ph { display: block; width: 100%; height: auto; background: var(--paper-2); }
  .gone-ink { color: var(--gone); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .map { position: relative; background: #e6e1d5; border: 1px solid var(--rule); overflow: hidden; }
  .map svg.base { display: block; width: 100%; height: auto; }
  .map .pin { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); padding: 8px 0; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .proposed-box { border: 2px dashed var(--proposed); background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(59,74,138,.07) 8px 16px); }
  .proposed-tag { display: inline-flex; gap: 4px; align-items: center; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--proposed); border: 1.5px dashed var(--proposed); padding: 1px 6px; background: var(--paper); }

  /* ---------- Variant A: editorial catalogue labels ---------- */
  .A-top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  @media (max-width: 860px) { .A-top { grid-template-columns: 1fr; } }
  .A-labels { display: flex; flex-direction: column; gap: 0; max-height: 560px; overflow: auto; border-top: 1px solid var(--ink); }
  .A-label { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
  .A-label[aria-current="true"] { background: var(--paper-2); }
  .A-label h3 { font: 600 17px/1.2 var(--serif); margin: 0 0 2px; }
  .A-label .meta { font-size: 13px; color: var(--ink-2); }
  .A-cond { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; display: inline-flex; gap: 5px; align-items: center; }
  .A-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; border-top: 2px solid var(--ink); padding-top: 20px; }
  @media (max-width: 860px) { .A-detail { grid-template-columns: 1fr; } }
  .A-detail h2 { font: 600 34px/1.05 var(--serif); margin: 0 0 6px; }
  .A-tombstone { font: 17px/1.5 var(--serif); }
  .A-tombstone p { margin: 0 0 4px; }
  .A-tombstone em { color: var(--ink-2); }
  .A-condline { margin: 14px 0; padding: 10px 12px; border-left: 4px solid currentColor; background: var(--paper-2); }
  .A-condline .A-cond { font-size: 13px; }
  .A-tl { list-style: none; margin: 0; padding: 0; }
  .A-tl li { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .A-tl .when { font: 14px var(--serif); text-align: right; }
  .A-tl .when small { display: block; font: 11px var(--mono); color: var(--ink-2); }
  .A-tl .what { font-size: 14px; }
  .A-tl .what strong { font: 600 15px var(--serif); }
  .A-tl li.proposed-box { padding: 10px 8px; }
  .A-cites { font-size: 12px; color: var(--ink-2); }
  .sym-box { margin-top: 18px; padding: 12px 14px; border: 1px solid var(--ink); background: #fff8; font-size: 13.5px; }
  .sym-key { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule); }
  .A-tl .what .A-cond { font-size: 10.5px; }

  /* ---------- notes panel + switcher (not part of the design) ---------- */
  .notes { position: fixed; right: 12px; top: 40px; bottom: 80px; width: min(440px, calc(100vw - 24px)); overflow: auto; background: #fff; color: #111; border: 2px solid #111; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 16px 18px; font: 14px/1.5 var(--sans); z-index: 20; filter: none; }
  .notes h2 { font-size: 16px; margin: 0 0 8px; }
  .notes h3 { font-size: 13px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .notes ol, .notes ul { padding-left: 20px; margin: 4px 0; }
  .switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; align-items: center; gap: 4px; padding: 6px 8px; font: 13px var(--sans); z-index: 30; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
  .switcher button { background: #2a2a2a; border: 0; color: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .switcher button[aria-pressed="true"] { background: #fff; color: #111; }
  .switcher .cur { padding: 0 10px; font-weight: 600; min-width: 170px; text-align: center; }
  .switcher .sep { width: 1px; height: 20px; background: #555; margin: 0 4px; }
</style>
</head>

    col: { n: 'No.', title: 'Title', type: 'Type', cond: 'Condition', last: 'Last doc.', author: 'Attribution', cert: 'Certainty', loc: 'Location', fact: 'Fact', value: 'Value', certainty: 'Certainty', evidence: 'Evidence', status: 'Status' },
    known: 'known', estimated: 'estimated', unknownV: 'unknown', disputedV: 'disputed',
    kExpr: 'Type', kLoc: 'Location', kAuthor: 'Attribution', kCreated: 'Created', kCond: 'Condition',
    fictional: 'fictional record',
  },
};
// Expression types are Instance vocabulary; content stays in the content language (Italian).
const EXPR = { mural: 'murale', pasteup: 'paste-up', stencil: 'stencil', graffiti: 'graffiti', installation: 'installazione', sticker: 'sticker' };

// ---------------------------------------------------------------- fictional data
// d(from, to, precision, qualifier)
const d = (from, to = from, precision = 'year', qualifier = 'exact') => ({ from, to, precision, qualifier });
const ARTWORKS = [
  { id: 'a1', n: 1, title: 'La lupa di tufo', expr: ['mural'], area: 'Quadraro', x: 690, y: 430, loc: { kind: 'exact' }, tone: '#b9a27e',
    attr: [{ name: 'Collettivo Tufo', cert: 'confirmed', cites: 2 }],
    events: [
      { type: 'created', date: d('2019-05', '2019-05', 'month'), ev: 'documented', cites: 2, cond: 'intact', submitted: '2023-02-10', approved: '2023-02-14' },
      { type: 'doc', date: d('2019-06-02', '2019-06-02', 'day'), creator: 'Giulia R.' },
      { type: 'doc', date: d('2024-03', '2024-03', 'month'), creator: 'm.ferri' },
      { type: 'doc', date: d('2026-04-12', '2026-04-12', 'day'), creator: 'Giulia R.' },
      { type: 'damaged', date: d('2026-09-28', '2026-09-28', 'day'), ev: 'documented', cites: 1, cond: 'damaged', proposal: { status: 'submitted', submitted: '2026-09-30' }, note: 'Tag sovrapposti sulla parte bassa.' },
    ] },
  { id: 'a2', n: 2, title: 'Mani sul Pigneto', expr: ['pasteup'], area: 'Pigneto', x: 610, y: 250, loc: { kind: 'approximate', radius: 40 }, tone: '#d9cdb5',
    attr: [{ name: 'MRLN', cert: 'probable', cites: 0 }],
    events: [
      { type: 'created', date: d('2016', '2016', 'year', 'circa'), ev: 'reported', cites: 0, cond: 'intact', submitted: '2024-05-02', approved: '2024-05-06' },
      { type: 'doc', date: d('2017-08', '2017-08', 'month'), creator: 'anonimo' },
      { type: 'overpainted', date: d('2022', '2023', 'year'), ev: 'documented', cites: 1, cond: 'covered', submitted: '2024-05-02', approved: '2024-05-06', note: 'Coperta da un\'altra opera (record collegato).' },

  { id: 'a3', n: 3, title: 'Gabbiano sul gasometro', expr: ['stencil'], area: 'Ostiense', x: 380, y: 470, loc: { kind: 'exact' }, tone: '#a6a39b',
    attr: [],
    events: [
      { type: 'created', date: d('2012', '2012', 'year', 'before'), ev: 'reported', cites: 0, cond: 'intact', submitted: '2022-11-01', approved: '2022-11-03' },
      { type: 'doc', date: d('2011-09', '2011-09', 'month'), creator: 'archivio F. Neri' },
      { type: 'doc', date: d('2020-02-15', '2020-02-15', 'day'), creator: 'Sara T.' },
      { type: 'destroyed', date: d('2021-03-08', '2021-03-08', 'day'), ev: 'documented', cites: 2, cond: 'destroyed', submitted: '2021-03-10', approved: '2021-03-12', note: 'Parete demolita durante lavori.' },

const PROPOSED_NEW = { id: 'p1', title: 'Senza titolo', expr: ['mural'], area: 'Testaccio', x: 330, y: 380, loc: { kind: 'approximate', radius: 15 }, proposal: { status: 'submitted', submitted: '2026-10-02' } };

// ---------------------------------------------------------------- state
const qs = new URLSearchParams(location.search);
const VARIANTS = [['1', 'Geometrica astratta'], ['2', 'Pittogrammi'], ['3', 'Cartografia storica']];
const S = {
  sym: VARIANTS.some(v => v[0] === qs.get('sym')) ? qs.get('sym') : '1',
  lang: qs.get('lang') === 'en' ? 'en' : 'it',
  viewer: qs.get('viewer') === 'submitter' ? 'submitter' : 'public',
  gray: qs.get('gray') === '1',
  notes: qs.get('notes') === '1',
  sel: qs.get('art') || 'a1',
};
const t = () => T[S.lang];

// ---------------------------------------------------------------- derived domain bits
const approvedEvents = a => a.events.filter(e => !e.proposal);
const proposedEvents = a => a.events.filter(e => e.proposal);
function condition(a) {
  const evs = approvedEvents(a).filter(e => e.cond);
  return evs.length ? evs[evs.length - 1] : null; // events are kept in chronological order
}
const condKey = a => condition(a)?.cond ?? 'unknown';
const group = c => ['covered', 'removed', 'destroyed', 'missing'].includes(c) ? 'gone' : c === 'unknown' ? 'unknown' : 'present';
const docs = a => approvedEvents(a).filter(e => e.type === 'doc');
const lastDoc = a => docs(a).slice(-1)[0];
const certOf = a => a.attr.length === 0 ? 'unknown' : a.attr[0].cert;

function fmtPoint(s, precision) {
  const [y, m, dd] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, (m || 1) - 1, dd || 1));
  const loc = S.lang === 'it' ? 'it-IT' : 'en-GB';
  if (precision === 'day') return new Intl.DateTimeFormat(loc, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(dt);
  if (precision === 'month') return new Intl.DateTimeFormat(loc, { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(dt);
  if (precision === 'decade') return t().decade(String(y));
  return String(y);
}
function fmtDate(dd) {
  if (!dd || dd.precision === 'unknown') return t().dateUnknown;
  let core = fmtPoint(dd.from, dd.precision);
  if (dd.to !== dd.from && dd.precision !== 'decade') core += '–' + fmtPoint(dd.to, dd.precision);
  if (dd.qualifier === 'circa') return `${t().circa} ${core}`;
  if (dd.qualifier === 'before') return `${t().before} ${core}`;
  if (dd.qualifier === 'after') return `${t().after} ${core}`;
  return core;
}
const isFuzzy = dd => !dd || dd.qualifier !== 'exact' || dd.from !== dd.to || dd.precision === 'decade' || dd.precision === 'unknown';
const fmtIso = s => fmtPoint(s, 'day');
const createdEvent = a => approvedEvents(a).find(e => e.type === 'created');

  };
  return o + g[c] + '</svg>';
}

  approx: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6" stroke-dasharray="2 2"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>',

  doc: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="12" height="9"/><circle cx="8" cy="8.5" r="2.3"/><path d="M5.5 4l1-2h3l1 2"/></svg>',
  src: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h6l3 3v9H4z M10 2v3h3"/></svg>',
  person: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2.5 15c.5-3.5 2.6-5 5.5-5s5 1.5 5.5 5"/></svg>',
  split: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 15V8M8 8L3 2M8 8l5-6"/></svg>',
  pending: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6" stroke-dasharray="2 2"/><path d="M8 4.5V8l2.5 1.5"/></svg>',
};

function photo(a, w = 400, h = 260, label = true) {
  // Neutral placeholders: not every artwork is a colourful mural.
  const shapes = {
    mural: `<rect x="${w * .1}" y="${h * .15}" width="${w * .8}" height="${h * .7}" fill="${a.tone}" opacity=".85"/><circle cx="${w * .5}" cy="${h * .5}" r="${h * .22}" fill="#6d5a42" opacity=".6"/>`,
    pasteup: `<rect x="${w * .3}" y="${h * .12}" width="${w * .4}" height="${h * .76}" fill="#f6f2e8" stroke="#888"/><path d="M${w * .38} ${h * .7} q${w * .12} -${h * .4} ${w * .24} 0" stroke="#333" stroke-width="6" fill="none"/>`,
    stencil: `<path d="M${w * .3} ${h * .55} q${w * .2} -${h * .35} ${w * .4} 0 q-${w * .2} -${h * .12} -${w * .4} 0" fill="#222"/>`,
    graffiti: `<text x="${w * .5}" y="${h * .62}" text-anchor="middle" font-size="${h * .32}" font-weight="900" font-family="Impact, sans-serif" fill="#7a3e22" stroke="#222" stroke-width="3">RGN</text>`,
    installation: `<path d="M${w * .2} ${h * .2}H${w * .8}" stroke="#555" stroke-width="3"/>${[.3, .42, .55, .68].map((p, i) => `<path d="M${w * p} ${h * .2}v${h * (.25 + i * .06)}" stroke="#555"/><circle cx="${w * p}" cy="${h * (.47 + i * .06)}" r="7" fill="#8d8a80"/>`).join('')}`,
    sticker: [...Array(14)].map((_, i) => `<rect x="${w * (.15 + (i * 37 % 70) / 100)}" y="${h * (.2 + (i * 23 % 55) / 100)}" width="${22 + i % 3 * 8}" height="${16 + i % 4 * 5}" fill="${['#ddd', '#b8b1a0', '#9a9488', '#efeae0'][i % 4]}" stroke="#777"/>`).join(''),
  };
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#b5ada0"/><path d="M0 ${h * .9}H${w}" stroke="#968e80" stroke-width="${h * .2}"/>${[...Array(8)].map((_, i) => `<path d="M0 ${i * h / 8}H${w}" stroke="#a69e90" stroke-width="1"/>`).join('')}${shapes[a.expr[0]]}${label ? `<text x="8" y="${h - 8}" font-family="monospace" font-size="11" fill="#333">${t().placeholder}</text>` : ''}</svg>`;
  return `<img class="ph" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
}

function baseMap() {
  return `<svg class="base" viewBox="0 0 1000 600" aria-hidden="true">
    <rect width="1000" height="600" fill="#e6e1d5"/>
    <path d="M250 0 C 200 120, 330 180, 270 300 S 330 470, 290 600" stroke="#b9c4c8" stroke-width="28" fill="none"/>
    <g stroke="#fbf9f4" stroke-width="7" fill="none">
      <path d="M0 230 L1000 160"/><path d="M380 0 L760 600"/><path d="M300 600 L620 0"/><path d="M500 300 L1000 420"/><path d="M0 420 L520 330"/><path d="M700 0 L880 600"/>
    </g>
    <g font-family="monospace" font-size="13" fill="#8b8476">
      <text x="590" y="225">Pigneto</text><text x="700" y="470">Quadraro</text><text x="350" y="510">Ostiense</text><text x="520" y="140">San Lorenzo</text><text x="660" y="360">Tor Pignattara</text><text x="840" y="335">Centocelle</text><text x="300" y="410">Testaccio</text>
    </g></svg>`;
}
const pct = (x, y) => `left:${x / 10}%;top:${y / 6}%`;
// Approximate locations: a dashed area drawn as % of map width.
const halo = a => a.loc.kind === 'approximate' ? `<span aria-hidden="true" style="position:absolute;${pct(a.x, a.y)};width:${a.loc.radius / 4}%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px dashed var(--ink-2);border-radius:50%;background:var(--halo)"></span>` : '';

function pinLabel(a) {
  const L = t();
  return `${a.title} — ${L.cond[condKey(a)]}, ${L.loc[a.loc.kind]}`;
}
function proposalTag() { return `<span class="proposed-tag">${ICO.pending} ${t().proposed} · ${t().inReview}</span>`; }

function attributionText(a, style) {
  const L = t();
  if (!a.attr.length) return style === 'A' ? `<em>${L.unknownAuthor}</em>` : L.unknownAuthor;
  const c = a.attr[0].cert;
  const names = a.attr.map(x => x.name);
  if (style === 'A') {
    if (c === 'confirmed') return names.join(', ');
    if (c === 'probable') return `[${names.join(', ')}] <em>— ${L.probableBy.toLowerCase()}</em>`;
    return `<em>${L.disputedBetween}:</em> ${names.join(' <em>o</em> ')}`;
  }
  return names.join(c === 'disputed' ? ' / ' : ', ');
}
function evidenceText(e) {
  const L = t();
  return e.ev === 'documented' ? `${ICO.src} ${L.ev.documented} · ${L.sources(e.cites)}` : `${L.ev.reported} · ${L.noSources}`;
}

// ================================================================ Symbologies
// Layout is fixed (variant A, chosen in round 1). What varies is the symbol set:
// map markers, condition glyphs, approximate location, proposals.
const svg = (inner, size = 16, vb = 16, cls = 'ico') => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 ${vb} ${vb}" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">${inner}</svg>`;

// Set 2: descriptive pictograms of what happened to the surface.
const PICTO = {
  intact: '<rect x="2" y="3" width="12" height="10" fill="currentColor"/>',
  deteriorated: '<rect x="2" y="3" width="12" height="10"/><path d="M2 13V9h3V7h3v6zM10 3h4v3h-2V5h-2z" fill="currentColor"/>',
  damaged: '<rect x="2" y="3" width="12" height="10" fill="currentColor"/><path d="M7 3l2 3-2 2.5L9.5 13" stroke="var(--paper)" stroke-width="1.8"/>',
  modified: '<rect x="2" y="3" width="12" height="10"/><path d="M4 11.5l8-6.5" stroke-width="2.6" stroke-linecap="round"/>',
  covered: '<rect x="2" y="5.5" width="9" height="8.5"/><rect x="5" y="2" width="9" height="8.5" fill="currentColor"/>',
  removed: '<rect x="2" y="5" width="9" height="9" stroke-dasharray="2 1.6"/><path d="M7.5 8.5L14 2M10 2h4v4"/>',
  destroyed: '<path d="M1.5 14h13M2.5 14l1.5-4 2 2 2-5 2 4 2-2 1.5 5"/><path d="M4 10l1-1M9 7l1 1" />',
  missing: '<rect x="2" y="2" width="9" height="9" stroke-dasharray="1.4 1.6"/><circle cx="11" cy="11" r="2.6"/><path d="M13 13l2 2"/>',
  unknown: '<circle cx="8" cy="8" r="6" stroke-dasharray="2 1.5"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4M8 11.6v.4"/>',
};
// Set 3: historical-map convention; only the group has a glyph, the word names the Condition.
const GROUPSIGN = {
  present: '<rect x="3" y="3" width="10" height="10" fill="currentColor"/>',
  gone: '<rect x="3" y="3" width="10" height="10" stroke-dasharray="2.4 1.8"/>',
  unknown: '<rect x="3" y="3" width="10" height="10" stroke-width="2" stroke-dasharray="0.01 2.5" stroke-linecap="round"/>',
};
const hatchHalo = a => a.loc.kind === 'approximate' ? `<span aria-hidden="true" style="position:absolute;${pct(a.x, a.y)};width:${a.loc.radius / 4}%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid var(--ink-2);border-radius:50%;background:repeating-linear-gradient(45deg, rgba(29,27,24,.22) 0 2px, transparent 2px 6px)"></span>` : '';
const pinBtn = (a, inner) => `<button class="pin" style="${pct(a.x, a.y)}" data-sel="${a.id}" aria-label="${pinLabel(a)}">${inner}</button>`;
const groupColor = g => g === 'gone' ? 'var(--gone)' : 'var(--ink)';

const SYMBOLOGIES = {
  1: {
    name: 'Geometrica astratta',
    idea: { it: 'Sulla mappa solo 3 forme per gruppo (punto pieno = visibile, quadrato barrato = non più visibile, “?” = sconosciuta). Nel testo, 9 glifi astratti: cerchi per le opere visibili, quadrati per quelle scomparse.', en: 'On the map only 3 group shapes (filled dot = visible, barred square = no longer visible, “?” = unknown). In text, 9 abstract glyphs: circles for visible works, squares for disappeared ones.' },
    icon: c => condIcon(c),
    approxIcon: ICO.approx,
    halo,
    marker(a) {
      const g = group(condKey(a));
      const shape = g === 'present' ? `<circle cx="11" cy="11" r="7" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>`
        : g === 'gone' ? `<rect x="4" y="4" width="14" height="14" fill="var(--paper)" stroke="var(--gone)" stroke-width="2.5"/><path d="M4 18L18 4" stroke="var(--gone)" stroke-width="2.5"/>`
        : `<circle cx="11" cy="11" r="7.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/><text x="11" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" stroke="none">?</text>`;
      return halo(a) + pinBtn(a, svg(shape, 22, 22, ''));
    },
    proposedMarker: p => `${halo(p)}<span class="pin" style="${pct(p.x, p.y)}">${svg('<rect x="3" y="3" width="18" height="18" transform="rotate(45 12 12)" fill="var(--paper)" stroke="var(--proposed)" stroke-width="2" stroke-dasharray="3 2"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="var(--proposed)" stroke="none">P</text>', 24, 24, '')}</span>`,
    mapLegend(L) {
      return [
        [svg('<circle cx="11" cy="11" r="7" fill="var(--ink)"/>', 16, 22, ''), L.group.present],
        [`<span style="color:var(--gone)">${svg('<rect x="4" y="4" width="14" height="14" stroke-width="2.5"/><path d="M4 18L18 4" stroke-width="2.5"/>', 16, 22, '')}</span>`, L.group.gone],
        [svg('<circle cx="11" cy="11" r="7.5" stroke-width="2" stroke-dasharray="3 2"/><text x="11" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">?</text>', 16, 22, ''), L.group.unknown],
        [ICO.approx, `${L.loc.approximate} (${S.lang === 'it' ? 'area tratteggiata' : 'dashed area'})`],
      ];
    },
    proposedLegend: () => svg('<rect x="3" y="3" width="18" height="18" transform="rotate(45 12 12)" stroke="var(--proposed)" stroke-width="2" stroke-dasharray="3 2"/>', 16, 24, ''),
  },
  2: {
    name: 'Pittogrammi',
    idea: { it: 'Ogni Condizione ha un pittogramma che descrive cosa è successo alla superficie (crepa, strato sopra, macerie, lente). Lo stesso pittogramma sta nel pin: sulla mappa si distinguono tutte e 9. Pin pieno = visibile, pin vuoto = non più visibile; senza punta = posizione approssimata.', en: 'Each Condition has a pictogram describing what happened to the surface (crack, layer on top, rubble, magnifier). The same pictogram sits in the pin: all 9 are distinguishable on the map. Filled pin = visible, hollow pin = no longer visible; no tip = approximate location.' },
    icon: c => svg(PICTO[c]),
    approxIcon: svg('<circle cx="8" cy="7" r="5"/><circle cx="8" cy="8" r="7" stroke-dasharray="1.5 1.5" stroke-width="1"/>'),
    halo,
    marker(a) {
      const c = condKey(a), g = group(c), col = groupColor(g);
      const tip = a.loc.kind === 'exact';
      const body = `<path d="${tip ? 'M15 37C15 37 3 22 3 14a12 12 0 0 1 24 0c0 8-12 23-12 23z' : 'M15 26a12 12 0 1 0 0-24a12 12 0 0 0 0 24z'}" fill="${g === 'present' ? 'var(--ink)' : 'var(--paper)'}" stroke="${col}" stroke-width="2" ${g === 'unknown' ? 'stroke-dasharray="3 2"' : ''}/>`;
      const icon = `<g transform="translate(7 6)" style="color:${g === 'present' ? 'var(--paper)' : col}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">${PICTO[c].replace(/var\(--paper\)/g, 'var(--ink)')}</svg></g>`;
      return halo(a) + `<button class="pin" style="${pct(a.x, a.y)};transform:translate(-50%,${tip ? '-100%' : '-50%'})" data-sel="${a.id}" aria-label="${pinLabel(a)}"><svg width="30" height="${tip ? 38 : 28}" viewBox="0 0 30 ${tip ? 38 : 28}" aria-hidden="true">${body}${icon}</svg></button>`;
    },
    proposedMarker: p => `${halo(p)}<span class="pin" style="${pct(p.x, p.y)}"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><circle cx="15" cy="14" r="12" fill="var(--paper)" stroke="var(--proposed)" stroke-width="2" stroke-dasharray="3 2"/><g transform="translate(7 6)" style="color:var(--proposed)">${svg('<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>', 16, 16, '')}</g></svg></span>`,
    mapLegend(L) {
      return [
        [svg('<path d="M15 37C15 37 3 22 3 14a12 12 0 0 1 24 0c0 8-12 23-12 23z" fill="var(--ink)"/>', 14, 38, ''), `${L.group.present} (${S.lang === 'it' ? 'pin pieno' : 'filled pin'})`],
        [`<span style="color:var(--gone)">${svg('<path d="M15 37C15 37 3 22 3 14a12 12 0 0 1 24 0c0 8-12 23-12 23z" stroke-width="2.5"/>', 14, 38, '')}</span>`, `${L.group.gone} (${S.lang === 'it' ? 'pin vuoto' : 'hollow pin'})`],
        [svg('<circle cx="15" cy="15" r="12" stroke-width="2.5"/><circle cx="15" cy="15" r="14" stroke-dasharray="2 2" stroke-width="1"/>', 14, 30, ''), `${L.loc.approximate} (${S.lang === 'it' ? 'senza punta' : 'no tip'})`],
      ];
    },
    proposedLegend: () => `<span style="color:var(--proposed)">${svg('<circle cx="8" cy="8" r="6" stroke-dasharray="2 1.5"/><path d="M8 4.5V8l2.5 1.5"/>')}</span>`,
  },
  3: {
    name: 'Cartografia storica',
    idea: { it: 'Convenzione delle carte storiche: ciò che esiste è pieno, ciò che non c’è più è tratteggiato (come gli edifici demoliti). Solo 3 segni, uno per gruppo; la parola dice quale Condizione. Approssimata = area a tratteggio obliquo, senza punto preciso.', en: 'Historical-map convention: what exists is solid, what is gone is dashed (like demolished buildings). Only 3 signs, one per group; the word names the Condition. Approximate = diagonally hatched area, no precise point.' },
    icon: c => svg(GROUPSIGN[group(c)]),
    approxIcon: svg('<circle cx="8" cy="8" r="6.5" stroke-width="1"/><path d="M4 12l8-8M3 8.5L8.5 3M7.5 13L13 7.5" stroke-width="1"/>'),
    halo: hatchHalo,
    marker(a) {
      const g = group(condKey(a)), col = groupColor(g);
      const s = a.loc.kind === 'approximate' ? 11 : 15;
      const shape = g === 'present' ? `<rect x="2" y="2" width="14" height="14" fill="var(--ink)" stroke="var(--paper)" stroke-width="1.5"/>`
        : `<rect x="2" y="2" width="14" height="14" fill="var(--paper)" stroke="${col}" stroke-width="2.2" stroke-dasharray="${g === 'gone' ? '3.5 2.2' : '0.01 3.2'}" stroke-width="${g === 'gone' ? 2.2 : 2.8}" stroke-linecap="round"/>`;
      return hatchHalo(a) + pinBtn(a, `<svg width="${s}" height="${s}" viewBox="0 0 18 18" aria-hidden="true">${shape}</svg>`);
    },
    proposedMarker: p => `${hatchHalo(p)}<span class="pin" style="${pct(p.x, p.y)}"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" fill="var(--paper)" stroke="var(--proposed)" stroke-width="2" stroke-dasharray="2 2"/><path d="M9 5v8M5 9h8" stroke="var(--proposed)" stroke-width="2"/></svg></span>`,
    mapLegend(L) {
      return [
        [svg(GROUPSIGN.present), L.group.present],
        [`<span style="color:var(--gone)">${svg(GROUPSIGN.gone)}</span>`, L.group.gone],
        [svg(GROUPSIGN.unknown), L.group.unknown],
        [svg('<circle cx="8" cy="8" r="6.5" stroke-width="1"/><path d="M4 12l8-8M3 8.5L8.5 3M7.5 13L13 7.5" stroke-width="1"/>'), `${L.loc.approximate} (${S.lang === 'it' ? 'area tratteggiata, segno più piccolo' : 'hatched area, smaller sign'})`],
      ];
    },
    proposedLegend: () => `<span style="color:var(--proposed)">${svg('<rect x="2" y="2" width="12" height="12" stroke-dasharray="2 2"/><path d="M8 5v6M5 8h6"/>')}</span>`,
  },
};
const sym = () => SYMBOLOGIES[S.sym];

function legendA() {
  const L = t(), Y = sym();
  const items = Y.mapLegend(L).map(([g, txt]) => `<span>${g}${txt}</span>`).join('');
  return `<div class="legend">${items}${S.viewer === 'submitter' ? `<span style="color:var(--proposed)">${Y.proposedLegend()}${L.proposed}</span>` : ''}</div>`;
}
// Full key: all nine Conditions as they appear in cards, detail and timeline.
function conditionKey() {
  const L = t();
  return `<div class="sym-key" aria-label="Condition key">${Object.keys(L.cond).map(c =>
    `<span class="A-cond ${group(c) === 'gone' ? 'gone-ink' : ''}">${sym().icon(c)} ${L.cond[c]}</span>`).join('')}</div>`;
}
function condA(a, c = condKey(a)) {
  return `<span class="A-cond ${group(c) === 'gone' ? 'gone-ink' : ''}">${sym().icon(c)} ${t().cond[c]}</span>`;
}

function VariantA() {
  const L = t(), a = ARTWORKS.find(x => x.id === S.sel) || ARTWORKS[0];
  const cr = createdEvent(a), cev = condition(a), ld = lastDoc(a);
  const labels = ARTWORKS.map(x => {
    const c = createdEvent(x), ldx = lastDoc(x);
    return `<button class="A-label" data-sel="${x.id}" aria-current="${x.id === a.id}">
      ${photo(x, 144, 108, false)}
      <span><h3>${x.title}</h3>
      <span class="meta">${attributionText(x, 'A')}, ${c ? fmtDate(c.date) : `<em>${L.dateUnknown}</em>`}<br>
      ${EXPR[x.expr[0]]} · ${x.area}${x.loc.kind === 'approximate' ? ` <em>(${L.loc.approximate.toLowerCase()})</em>` : ''}</span><br>
      ${condA(x)} <span class="meta">· ${ldx ? `${L.lastDoc} ${fmtDate(ldx.date)}` : ''}</span></span>
    </button>`;
  }).join('') + (S.viewer === 'submitter' ? `<div class="A-label proposed-box" style="cursor:default"><span></span><span><h3>${PROPOSED_NEW.title}</h3>${proposalTag()}<br><span class="meta">${EXPR.mural} · ${PROPOSED_NEW.area} · ${L.submitted} ${fmtIso(PROPOSED_NEW.proposal.submitted)}</span></span></div>` : '');

  const tl = a.events.filter(e => S.viewer === 'submitter' || !e.proposal).map(e => {
    const fuzzy = isFuzzy(e.date);
    const what = e.type === 'doc'
      ? `${ICO.doc} <strong>${L.evt.doc}</strong> — ${L.photoBy}: ${e.creator}`
      : `<strong>${L.evt[e.type]}</strong>${e.cond ? ` → ${condA(a, e.cond)}` : ''}${e.note ? `<br>${e.note}` : ''}<br><span class="A-cites">${evidenceText(e)}${e.approved ? ` · ${L.submitted} ${fmtIso(e.submitted)} · ${L.approved} ${fmtIso(e.approved)}` : ''}</span>`;
    return `<li class="${e.proposal ? 'proposed-box' : ''}"><div class="when">${fuzzy ? `<em>${fmtDate(e.date)}</em>` : fmtDate(e.date)}<small>${L.observed}</small></div>
      <div class="what">${e.proposal ? `${proposalTag()} <span class="A-cites">${L.submitted} ${fmtIso(e.proposal.submitted)} · ${L.onlyYou}</span><br>` : ''}${what}${e.proposal ? `<br><span class="A-cites">${L.proposalNote}</span>` : ''}</div></li>`;
  });
  if (!cr) tl.unshift(`<li><div class="when"><em>?</em></div><div class="what"><em>${L.createdUnknown}</em></div></li>`);

  return `
  <section class="sym-box"><strong>${S.sym}. ${sym().name}</strong> — ${sym().idea[S.lang]}${conditionKey()}</section>
  <div class="surface-label">${L.map} + ${L.cards}</div>
  <div class="A-top">
    <div><div class="map">${baseMap()}${ARTWORKS.map(sym().marker).join('')}${S.viewer === 'submitter' ? sym().proposedMarker(PROPOSED_NEW) : ''}</div>${legendA()}</div>
    <div class="A-labels">${labels}</div>
  </div>
  <div class="surface-label">${L.detail} + ${L.timeline}</div>
  <article class="A-detail">
    <div>
      ${photo(a, 600, 400)}
      <p class="fict">${L.fictional} · ${ld ? `${L.photoBy}: ${ld.creator}, ${fmtDate(ld.date)}` : ''}</p>
    </div>
    <div>
      <h2>${a.title}</h2>
      <div class="A-tombstone">
        <p>${attributionText(a, 'A')}</p>
        <p>${cr ? (isFuzzy(cr.date) ? `<em>${fmtDate(cr.date)}</em>` : fmtDate(cr.date)) : `<em>${L.createdUnknown}</em>`}</p>
        <p>${a.expr.map(e => EXPR[e]).join(', ')}</p>
        <p>${a.area} · ${a.loc.kind === 'approximate' ? `${sym().approxIcon} <em>${L.loc.approximate.toLowerCase()}, ${L.radius(a.loc.radius)}</em>` : `${ICO.exact} ${L.loc.exact.toLowerCase()}`}</p>
      </div>
      <div class="A-condline ${group(condKey(a)) === 'gone' ? 'gone-ink' : ''}">
        ${condA(a)}<br>
        <span style="color:var(--ink)">${cev ? `${L.since} ${fmtDate(cev.date)} · ${evidenceText(cev)}` : L.noSources}${ld ? `<br>${L.lastDoc}: ${fmtDate(ld.date)}` : ''}</span>
      </div>
      <ol class="A-tl">${tl.join('')}</ol>
    </div>
  </article>`;
}

// ---------------------------------------------------------------- notes (principles to react to)
const NOTES = `
<h2>Principi visivi — bozza da discutere (#17)</h2>
<ol>
  <li><b>Editoriale e archivistico.</b> Carta, inchiostro, serif per titoli e didascalie; una sola tinta per “non più visibile” e una per “proposta”. La fotografia è il materiale primario.</li>
  <li><b>Mai solo colore.</b> Ogni stato = parola + forma (icona, tratteggio, codice). Prova: tasto <i>Grigi</i> in basso.</li>
  <li><b>Incertezza come linguaggio, non come allarme.</b> “c. 2016”, “prima del 2012”, “probabile”, “contesa”, “approssimata”. Niente icone di warning, niente rosso per l’incerto. Convenzione proposta: <i>contorno pieno = accertato, tratteggiato = stimato/incerto</i>.</li>
  <li><b>Scomparsa con dignità.</b> Un’opera distrutta o coperta resta una scheda completa: si mostra l’ultima documentazione con la sua data, non un vuoto.</li>
  <li><b>La Condizione ha sempre una data.</b> Mai “attuale” nudo: “Intatta · ultima documentazione apr 2026”.</li>
  <li><b>Proposto ≠ accertato.</b> Le proposte non sono pubbliche. Per Submitter/Moderatori: tratteggio blu + etichetta “Proposta · in revisione”; non cambiano la Condizione mostrata.</li>
  <li><b>Evidence level è derivato e ispezionabile.</b> “documentato · 2 fonti” rimanda alle citazioni; “segnalato” è neutro, non una colpa.</li>
  <li><b>Tre date distinte</b> (osservato, inviato, approvato) visibili nella timeline, non nelle schede.</li>
</ol>
<h3>Da evitare</h3>
<ul><li>Semaforo verde/giallo/rosso, badge SaaS colorati, gradienti.</li><li>Contatori, like, “popolari”, gamification.</li><li>Placeholder che presuppongono murales colorati.</li><li>Nascondere le opere scomparse dalla mappa di default.</li></ul>
<h3>Domande aperte</h3>
<ul>
  <li>Sulla mappa, le opere scomparse sono visibili di default o dietro un filtro?</li>
  <li>“Coperta” e “distrutta” devono distinguersi già sul marker, o basta “non più visibile”?</li>
  <li>Il pubblico deve sapere che esistono proposte in revisione su un’opera (senza vederne il contenuto)?</li>
  <li>Glossario: il brief dice “present”; il vocabolario Condition dice “intact”. Confermare.</li>
</ul>
<h3>Round 2 — layout A, tre simbologie</h3>
<p>Le varianti B e C sono nel commit precedente del branch. Qui cambia solo il sistema di segni.</p>
<ul>
  <li><b>1 Geometrica astratta</b>: mappa a 3 gruppi + 9 glifi astratti nel testo. Compatta, ma i glifi vanno imparati.</li>
  <li><b>2 Pittogrammi</b>: 9 pittogrammi descrittivi, anche sulla mappa. Più leggibile senza legenda, ma pin più grandi e mappa più densa; i pittogrammi vanno disegnati bene.</li>
  <li><b>3 Cartografia storica</b>: 3 segni soltanto (pieno / tratteggiato / puntinato), la parola fa il resto. La più sobria e “archivistica”; nessuna distinzione per Condizione sulla mappa.</li>
</ul>`;

// ---------------------------------------------------------------- render + switcher
function sync() {
  const p = new URLSearchParams();
  p.set('variant', 'A'); p.set('sym', S.sym); if (S.lang !== 'it') p.set('lang', S.lang); if (S.viewer !== 'public') p.set('viewer', S.viewer);
  if (S.gray) p.set('gray', '1'); if (S.notes) p.set('notes', '1'); p.set('art', S.sel);
  history.replaceState(null, '', '?' + p);
}
function render() {
  document.documentElement.lang = S.lang;
  document.getElementById("app").classList.toggle("gray", S.gray);
  const L = t(), V = VariantA;
  document.getElementById('app').innerHTML = `<div class="wrap">
    <header class="archive-head"><h1>${L.archive}</h1><small>${L.powered}</small></header>
    <main>${V()}</main></div>`;
  const notes = document.getElementById('notes');
  notes.hidden = !S.notes; notes.innerHTML = NOTES;
  const idx = VARIANTS.findIndex(v => v[0] === S.sym);
  document.getElementById('switcher').innerHTML = `
    <button data-act="prev" aria-label="Simbologia precedente">←</button>
    <span class="cur">${S.sym}/3 ${VARIANTS[idx][1]}</span>
    <button data-act="next" aria-label="Simbologia successiva">→</button>
    <span class="sep"></span>
    <button data-act="gray" aria-pressed="${S.gray}">Grigi</button>
    <button data-act="lang" aria-pressed="false">${S.lang.toUpperCase()}</button>
    <button data-act="viewer" aria-pressed="${S.viewer === 'submitter'}">${S.viewer === 'submitter' ? 'Vista Submitter' : 'Vista pubblica'}</button>
    <button data-act="notes" aria-pressed="${S.notes}">Principi</button>`;
  sync();
}
function cycle(dir) {
  const i = VARIANTS.findIndex(v => v[0] === S.sym);
  S.sym = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0]; render();
}
document.addEventListener('click', e => {
  const sel = e.target.closest('[data-sel]');
  if (sel) { S.sel = sel.dataset.sel; render(); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'prev') cycle(-1);
  if (act === 'next') cycle(1);
  if (act === 'gray') { S.gray = !S.gray; render(); }
  if (act === 'lang') { S.lang = S.lang === 'it' ? 'en' : 'it'; render(); }
  if (act === 'viewer') { S.viewer = S.viewer === 'public' ? 'submitter' : 'public'; render(); }
  if (act === 'notes') { S.notes = !S.notes; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
