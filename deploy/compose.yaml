# Production stack (ADR 0004, ADR 0021): the released images only, pinned to
# TART_VERSION from .env. Development adds compose.dev.yaml, which builds the
# images from source. `api` and `worker` refuse to start until the database is
# at the code's migration head: run `docker compose run --rm api tart migrate`.
name: tart

# The `api` image also runs `worker` and the Operator CLI.
x-api-image: &api-image ghcr.io/spippoli/tart-api:${TART_VERSION:?set TART_VERSION}

# `api`, `worker`, and the one-shot `tart migrate` reach the database through it.
x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tart}

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TART_SITE_ADDRESS: ${TART_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api

  frontend:
    image: ghcr.io/spippoli/tart-frontend:${TART_VERSION:?set TART_VERSION}
    restart: unless-stopped
    environment:
      ORIGIN: https://${TART_SITE_ADDRESS:-localhost}

  api:
    image: *api-image
    restart: unless-stopped
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: *api-image
    restart: unless-stopped
    command: ["python", "-m", "tart.worker"]
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tart}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  db-data:
