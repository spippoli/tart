# Production stack (ADR 0004, ADR 0021): the released images only, pinned to
# TART_VERSION from .env. Development adds compose.dev.yaml, which builds the
# images from source. `api` and `worker` refuse to start until the database is
# at the code's migration head: run `docker compose run --rm api tart migrate`.
name: tart

# The `api` image also runs `worker` and the Operator CLI.
x-api-image: &api-image ghcr.io/spippoli/tart-api:${TART_VERSION:?set TART_VERSION}

# `api`, `worker`, and the one-shot CLI containers read the Instance configuration
# directory, mounted read-only at /config, and these variables: every secret and
# all infrastructure wiring (ADR 0009). An empty value counts as unset; the
# services refuse to start, listing every error, while a required one is missing.
x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tart}
  PUBLIC_BASE_URL: https://${TART_SITE_ADDRESS:-localhost}
  SESSION_KEY: ${SESSION_KEY:-}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

x-config-volume: &config-volume ${CONFIG_DIR:-./config}:/config:ro

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TART_SITE_ADDRESS: ${TART_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_DIR:-./config}/map:/srv/config/map:ro
      - caddy-data:/data
      - caddy-config:/config
      - tiles-data:/srv/tiles:ro
    depends_on:
      - frontend
      - api

  frontend:
    image: ghcr.io/spippoli/tart-frontend:${TART_VERSION:?set TART_VERSION}
    restart: unless-stopped
    environment:
      ORIGIN: https://${TART_SITE_ADDRESS:-localhost}
      # The frontend server reads the public Instance configuration from `api`.
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    image: *api-image
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - *config-volume
      # Basemap extracts (PMTILES_PATH): `tart tiles update` writes them, Caddy serves them.
      - tiles-data:/data/tiles
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: *api-image
    restart: unless-stopped
    command: ["python", "-m", "tart.worker"]
    # Its own memory limit, so that media processing cannot starve `api` and `db`.
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    environment: *api-environment
    volumes:
      - *config-volume
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tart}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  db-data:
  tiles-data:
