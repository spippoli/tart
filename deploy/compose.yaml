# Reference topology (ADR 0004). Start with `docker compose up --build`;
# add `--profile dev` for Mailpit. `api` and `worker` refuse to start until the
# database is at the code's migration head: run `docker compose run --rm api tart migrate`.
name: tart

# `api`, `worker`, and the one-shot `tart migrate` reach the database through it.
x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tart}

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TART_SITE_ADDRESS: ${TART_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      ORIGIN: https://${TART_SITE_ADDRESS:-localhost}

  api:
    build: ../backend
    image: tart-backend
    restart: unless-stopped
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    image: tart-backend
    restart: unless-stopped
    command: ["python", "-m", "tart.worker"]
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tart}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: [dev]
    ports:
      - "8025:8025"

volumes:
  caddy-data:
  caddy-config:
  db-data:
