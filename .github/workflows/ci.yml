name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Pull requests run only the jobs whose files changed; pushes to main run
  # everything. A job skipped by its `if` reports success, so it still
  # satisfies a required status check.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
      images: ${{ github.event_name == 'push' || steps.filter.outputs.images == 'true' }}
      release: ${{ github.event_name == 'push' || steps.filter.outputs.release == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - backend/**
              # A backend test checks this committed copy of the API schema.
              - frontend/src/lib/api/openapi.json
            frontend:
              - *workflow
              - frontend/**
            images:
              - *workflow
              - backend/**
              - frontend/**
              - deploy/**
            # The release tests read the workflow, the Compose files, both
            # project files, and the sources (no update checks).
            release:
              - *workflow
              - .github/workflows/release.yml
              - release/**
              - deploy/**
              - backend/pyproject.toml
              - backend/uv.lock
              - backend/src/**
              - frontend/package.json
              - frontend/scripts/licences.ts
              - frontend/src/**

  # Commit messages are release inputs (ADR 0021): every commit of a pull
  # request is checked, whatever files it changes.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: commitlint
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: commitlint/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: commitlint/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Lint the pull request's commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          TART_VERSION: "0.0.0"
          POSTGRES_PASSWORD: ci
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config --quiet
        env:
          TART_VERSION: dev
          POSTGRES_PASSWORD: ci
      - uses: docker/setup-buildx-action@v4.4.1
      # Layers are cached in the GitHub Actions cache, one scope per image.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # The release pipeline's tests (ADR 0021): bump rules and notes over
  # throwaway Git repositories, and the workflow and Compose files.
  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v7.0.1
      # set-version.sh writes the backend version with uv.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: release/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: release/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
