name: Release

# Started by hand on `main`, by convention when an implementation wave is
# complete (ADR 0021). It computes the next version, builds and pushes the
# images, and only then tags and publishes the GitHub Release, so an announced
# release always has its images. A failure before the last job leaves at most
# unannounced images: run the workflow again. Every job checks out the commit
# the run started from; if `main` moves meanwhile, semantic-release publishes
# nothing, the last job fails, and the run is started again.
on:
  workflow_dispatch:

permissions: {}

# Two releases never run at once; a second run waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      # semantic-release checks, even in a dry run, that it may push the tag.
      contents: write
    outputs:
      version: ${{ steps.dry-run.outputs.version }}
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: release/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: release/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: dry-run
        run: pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.dry-run.outputs.version == ''
        run: echo "::notice::No commit since the last release calls for one; nothing to release."

  # One native build per image and architecture, pushed by digest only: the
  # version tag is added once every build and the smoke test have passed.
  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        image: [api, frontend]
        arch: [amd64, arm64]
        include:
          - image: api
            context: backend
          - image: frontend
            context: frontend
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      # In this workspace only; nothing is committed (ADR 0021).
      - run: release/set-version.sh "$VERSION"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          outputs: type=image,name=ghcr.io/spippoli/tart-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.image }}-${{ matrix.arch }}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # The arm64 `api` image must start: migrate a database, then /api/health.
  smoke:
    needs: [version, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: digest-api-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The PostGIS image of deploy/compose.yaml exists for linux/amd64 only.
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: amd64
      - run: release/smoke-test.sh "ghcr.io/spippoli/tart-api@$(cat "$RUNNER_TEMP/digests/api-arm64")"
        env:
          DB_PLATFORM: linux/amd64

  # Each image gets one multi-architecture manifest, tagged with the exact
  # version and nothing else: no `latest`, no floating `0.3` or `0`.
  tag-images:
    needs: [version, build, smoke]
    strategy:
      matrix:
        image: [api, frontend]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/spippoli/tart-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Join the architectures under the version tag
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/${{ matrix.image }}-amd64")" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/${{ matrix.image }}-arm64")"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Only now: the tag, the GitHub Release, its notes and the Operator files.
  release:
    needs: [version, tag-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: release/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: release/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The release plugin refuses any version other than the images'.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TART_RELEASE_VERSION: ${{ env.VERSION }}
      # semantic-release exits cleanly without publishing when `main` moved.
      - name: Check that the release was published
        run: gh release view "v$VERSION" --json tagName,assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
