# Reviewed Python dependencies whose licence is not in ADR 0011's permissive tier.
# Checked by tools/licences.py. Each entry records the exact licence expression,
# so a licence change upstream needs a new review.
#
# [reviewed.<package>]
# licence = "LGPL-3.0-or-later"
# tier = "weak-copyleft"   # an unmodified library, dynamically linked
# reason = "How TART uses it, and why that fits the tier."

[reviewed.certifi]
licence = "MPL-2.0"
tier = "weak-copyleft"
reason = """Mozilla's CA bundle, unmodified; a development dependency \
(testcontainers, docker, requests) that is not in the api image."""

[reviewed.psycopg]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """The PostgreSQL driver of Procrastinate, the worker's job queue (ADR 0004); \
installed unmodified from PyPI and imported, never vendored or patched."""

[reviewed.psycopg-binary]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """psycopg's C implementation as an unmodified binary wheel, dynamically loaded \
by psycopg; it bundles libpq (PostgreSQL License, permissive) so the slim image needs no \
system libpq."""

[reviewed.psycopg-pool]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """psycopg's connection pool, used unmodified by Procrastinate's psycopg connector."""

[reviewed.cffi]
licence = "MIT-0"
tier = "permissive"
reason = """The C foreign-function interface of cryptography, which py_webauthn needs for \
passkeys (ADR 0005). MIT No Attribution is OSI-approved and grants at least what MIT does, \
but ADR 0011 §8 does not name it: pending the maintainer's confirmation."""

[reviewed.pyasn1_modules]
licence = "BSD"
tier = "permissive"
reason = """ASN.1 modules used by py_webauthn to read attestation certificates (ADR 0005). \
The metadata says only "BSD"; the LICENSE.txt it ships is BSD-2-Clause."""

[reviewed.pillow]
licence = "MIT-CMU"
tier = "permissive"
reason = """The image library of the media pipeline, named by ADR 0004. The CMU licence \
(Historical Permission Notice and Disclaimer family) is OSI-approved and asks only that \
the notice is kept, as MIT does."""

[reviewed.pypdfium2]
licence = "BSD-3-Clause AND Apache-2.0 AND LicenseRef-PDFium-dependencies"
tier = "permissive"
reason = """PDF first-page previews in the media pipeline, named by ADR 0004. The wheel \
bundles a PDFium binary whose libraries, listed in its BUILD_LICENSES, are all \
permissive: abseil, LLVM libc (Apache-2.0), AGG, OpenJPEG, simdutf (BSD), FreeType \
(FreeType License), ICU (Unicode), Little CMS, fast_float (MIT), libjpeg-turbo (IJG, \
BSD), libpng, libtiff, and zlib."""
