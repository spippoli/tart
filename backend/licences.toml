# Reviewed Python dependencies whose licence is not in ADR 0011's permissive tier.
# Checked by tools/licences.py. Each entry records the exact licence expression,
# so a licence change upstream needs a new review.
#
# [reviewed.<package>]
# licence = "LGPL-3.0-or-later"
# tier = "weak-copyleft"   # an unmodified library, dynamically linked
# reason = "How TART uses it, and why that fits the tier."

[reviewed.certifi]
licence = "MPL-2.0"
tier = "weak-copyleft"
reason = """Mozilla's CA bundle, unmodified; a development dependency \
(testcontainers, docker, requests) that is not in the api image."""

[reviewed.psycopg]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """The PostgreSQL driver of Procrastinate, the worker's job queue (ADR 0004); \
installed unmodified from PyPI and imported, never vendored or patched."""

[reviewed.psycopg-binary]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """psycopg's C implementation as an unmodified binary wheel, dynamically loaded \
by psycopg; it bundles libpq (PostgreSQL License, permissive) so the slim image needs no \
system libpq."""

[reviewed.psycopg-pool]
licence = "LGPL-3.0-only"
tier = "weak-copyleft"
reason = """psycopg's connection pool, used unmodified by Procrastinate's psycopg connector."""

[reviewed.pyasn1_modules]
licence = "BSD"
tier = "permissive"
reason = """ASN.1 modules used by py_webauthn to read attestation certificates (ADR 0005). \
The metadata says only "BSD"; the LICENSE.txt it ships is BSD-2-Clause."""
