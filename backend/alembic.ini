# For writing migrations in development (`uv run alembic revision -m "..."`).
# Applying them goes through `tart migrate`; the database is `DATABASE_URL`.
[alembic]
script_location = %(here)s/src/tart/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Keep generated migrations lint-clean.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
