[project]
name = "tart"
version = "0.0.0"
description = "TART: a collaborative, moderated platform for preserving the history of urban art."
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiobotocore==3.9.2",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "geoalchemy2==0.20.0",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
]

[project.scripts]
tart = "tart.cli:main"

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
